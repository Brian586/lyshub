<!DOCTYPE html>
<html lang="en-US">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
   <meta name="robots" content="noindex">

   <title>Page Not Found | Lyshub Technologies</title>

   <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
   <link rel="stylesheet" href="/assets/css/converta.css" type="text/css" media="all">

   <style>
      .error-wrap {
         min-height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         text-align: center;
         padding: 80px 20px;
         background:
            radial-gradient(760px 420px at 82% 0%, var(--p-header-gradient), var(--p-header-gradient-end) 70%),
            var(--p-header-bg);
      }

      .error-code {
         font-size: 140px;
         line-height: 1;
         font-weight: 700;
         letter-spacing: -6px;
         color: var(--primary);
         margin: 0 0 18px;
      }

      @media (max-width: 575px) {
         .error-code {
            font-size: 92px;
            letter-spacing: -4px;
         }
      }
   </style>
</head>

<body>
   <div class="error-wrap">
      <div class="container container-narrow">
         <a class="brand" href="/index.html" style="justify-content:center;margin-bottom:40px;">
            <img src="/assets/images/logo-default.png" alt="Lyshub Technologies" style="height:44px;">
         </a>
         <p class="error-code">404</p>
         <h1>Page Not Found</h1>
         <p class="lead">The page you are looking for does not exist, or has moved. Check the URL for mistakes, or head
            back to a good starting point.</p>
         <div class="gap-16" style="justify-content:center;margin-top:34px;">
            <a class="btn" href="/index.html">Back to Home</a>
            <a class="btn btn-outline" href="/contact.html">Contact Us</a>
         </div>
      </div>
   </div>
</body>

</html>
